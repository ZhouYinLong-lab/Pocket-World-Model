name: Bug report
description: Report a reproducible simulator, model, planner, export, or demo problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide commands, seed, checkpoint metadata, and minimal steps.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python/Node version, device, and browser when relevant.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This report does not disclose a security vulnerability publicly.
          required: true
