[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-world-model"
version = "0.1.0"
description = "A tiny and observable world model for 2D dynamics and imagined planning."
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=0.29",
  "numpy>=1.24",
  "pillow>=10.0",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
export = ["onnx>=1.16", "onnxscript>=0.1"]

[project.scripts]
pocketworld-train = "pocketworld.train:main"
pocketworld-export-onnx = "pocketworld.export_onnx:main"
pocketworld-evaluate = "pocketworld.evaluate:main"

[tool.setuptools.packages.find]
include = ["pocketworld*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
