[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-world-model"
version = "0.15.0"
description = "A tiny and observable world model for 2D dynamics and imagined planning."
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=0.29",
  "numpy>=1.24",
  "pillow>=10.0",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
export = ["onnx>=1.16", "onnxscript>=0.1"]

[project.scripts]
pocketworld-train = "pocketworld.train:main"
pocketworld-export-onnx = "pocketworld.export_onnx:main"
pocketworld-evaluate = "pocketworld.evaluate:main"
pocketworld-evaluate-collision = "pocketworld.evaluate_collision:main"
pocketworld-evaluate-generalization = "pocketworld.evaluate_generalization:main"
pocketworld-evaluate-maturity = "pocketworld.evaluate_maturity:main"
pocketworld-evaluate-imagination = "pocketworld.evaluate_imagination:main"
pocketworld-evaluate-planners = "pocketworld.evaluate_planners:main"
pocketworld-evaluate-uncertainty = "pocketworld.evaluate_uncertainty:main"
pocketworld-evaluate-route-completion = "pocketworld.evaluate_route_completion:main"
pocketworld-evaluate-safety-methods = "pocketworld.evaluate_safety_methods:main"
pocketworld-evaluate-safety-sweep = "pocketworld.evaluate_safety_sweep:main"
pocketworld-evaluate-route-variants = "pocketworld.evaluate_route_variants:main"
pocketworld-evaluate-route-controller = "pocketworld.evaluate_route_controller:main"
pocketworld-evaluate-learned-route = "pocketworld.evaluate_learned_route_policy:main"
pocketworld-evaluate-route-sketch = "pocketworld.evaluate_route_sketch:main"
pocketworld-evaluate-gap-route = "pocketworld.evaluate_gap_route_policy:main"

[tool.setuptools.packages.find]
include = ["pocketworld*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
