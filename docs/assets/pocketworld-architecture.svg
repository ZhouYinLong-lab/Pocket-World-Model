sans-serif" font-size="13">position + velocity</text></g><g transform="translate(814 82)"><rect width="158" height="92" rx="14" fill="#ffffff" stroke="#70835f" stroke-opacity=".65"/><circle cx="22" cy="23" r="5" fill="#70835f"/><text x="36" y="29" fill="#151614" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">RGB decoder</text><text x="22" y="62" fill="#687063" font-family="Segoe UI,Arial,sans-serif" font-size="13">future frame</text></g><g transform="translate(1007 82)"><rect width="158" height="92" rx="14" fill="#ffffff" stroke="#419400" stroke-opacity=".65"/><circle cx="22" cy="23" r="5" fill="#419400"/><text x="36" y="29" fill="#151614" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Planner</text><text x="22" y="62" fill="#687063" font-family="Segoe UI,Arial,sans-serif" font-size="13">best actions</text></g>
