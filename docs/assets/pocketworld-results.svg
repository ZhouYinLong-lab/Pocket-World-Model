<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">PocketWorld headline evaluation results</title><desc id="desc">Planning success and composited agent position error across horizons.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fdef"/><stop offset="1" stop-color="#eef4e8"/></linearGradient></defs><rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <text x="42" y="45" fill="#151614" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">What the tiny model can do — and where imagination breaks</text>
  <g transform="translate(42 82)"><rect width="176" height="150" rx="16" fill="#ffffff" stroke="#a9c79a"/><text x="20" y="32" fill="#687063" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="1.2">16-STEP PLANNING</text><text x="20" y="86" fill="#419400" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="700">96%</text><text x="20" y="113" fill="#151614" font-family="Segoe UI,Arial,sans-serif" font-size="14">real success</text><text x="20" y="136" fill="#687063" font-family="Segoe UI,Arial,sans-serif" font-size="11">98% imagined · 2pp gap</text></g>
  <g transform="translate(236 82)"><rect width="176" height="150" rx="16" fill="#ffffff" stroke="#b6d5a7"/><text x="20" y="32" fill="#687063" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="1.2">32-STEP PLANNING</text><text x="20" y="86" fill="#69a94e" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="700">7pp</text><text x="20" y="113" fill="#151614" font-family="Segoe UI,Arial,sans-serif" font-size="14">imagination gap</text><text x="20" y="136" fill="#687063" font-family="Segoe UI,Arial,sans-serif" font-size="11">100% imagined · 93% real</text></g>
  <g transform="translate(430 82)"><rect width="176" height="150" rx="16" fill="#ffffff" stroke="#a9c79a"/><text x="20" y="32" fill="#687063" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="1.2">BARRIER TEST</text><text x="20" y="86" fill="#419400" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="700">77%</text><text x="20" y="113" fill="#151614" font-family="Segoe UI,Arial,sans-serif" font-size="14">history + uncertainty</text><text x="20" y="136" fill="#687063" font-family="Segoe UI,Arial,sans-serif" font-size="11">150 eps · 3 seeds</text></g>
